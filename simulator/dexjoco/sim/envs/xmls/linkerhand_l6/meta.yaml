schema_version: 1
kind: hand
name: linkerhand_l6
drive: position

# Stands alone as a robot: the composer's derive_solo step emits a loadable
# single-hand unit (units/l6_l, units/l6_r) per variant.
emit_solo_unit: true

# L/R variants share structure but ship pre-mirrored meshes. The {S}
# placeholder expands to `l` or `r` to form the joint-name prefix
# (lh_*, rh_*) used in each variant's source URDF.
variants:
  left:
    vars: {S: l}
    urdf: left/source.urdf
    mjcf: left/hand.xml
    meshdir: left/meshes
  right:
    vars: {S: r}
    urdf: right/source.urdf
    mjcf: right/hand.xml
    meshdir: right/meshes

root_link: "{S}h_hand_base_link"

mount_frames:
  wrist_mount:
    parent: "{S}h_hand_base_link"

# The hand has 6 independently-driven joints + 5 mimic joints (the
# distal-interphalangeal joints are coupled to their MCP joints via URDF
# <mimic> tags; MuJoCo-side the composed URDF carries an <equality
# polycoef> block from the source hand URDF).
actuated_joints:
  - "{S}h_thumb_cmc_roll"
  - "{S}h_thumb_cmc_pitch"
  - "{S}h_index_mcp_pitch"
  - "{S}h_middle_mcp_pitch"
  - "{S}h_ring_mcp_pitch"
  - "{S}h_pinky_mcp_pitch"

mimic_joints:
  - "{S}h_thumb_dip"
  - "{S}h_index_dip"
  - "{S}h_middle_dip"
  - "{S}h_ring_dip"
  - "{S}h_pinky_dip"

default_gains:
  stiffness: 5.0
  damping: 1.0

gain_profiles:
  joint:
    stiffness: 5.0
    damping: 1.0
